<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoritma Analizi - Konu Bazlı Quiz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-border: #2a2e38;
    --text: #e8e9ed;
    --text-secondary: #9aa0ab;
    --accent: #5b8cff;
    --success-bg: #16321f;
    --success-border: #2f8a4f;
    --success-text: #6fdc8c;
    --danger-bg: #3a1c1c;
    --danger-border: #b3413e;
    --danger-text: #ff8a85;
    --chip-bg: #20242c;
    --chip-active: #2c3450;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 16px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0 0 24px;
  }

  .topic-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .topic-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--chip-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }

  .topic-chip:hover {
    border-color: var(--accent);
  }

  .topic-chip.active {
    background: var(--chip-active);
    border-color: var(--accent);
  }

  .topic-chip .topic-name {
    font-size: 15px;
    font-weight: 500;
  }

  .topic-chip .topic-count {
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--card);
    border-radius: 20px;
    padding: 2px 10px;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .topic-chip.active .topic-count {
    color: var(--accent);
  }

  .check-icon {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--text-secondary);
    border-radius: 4px;
    margin-right: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .topic-chip.active .check-icon {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-icon svg {
    width: 12px;
    height: 12px;
    display: none;
  }

  .topic-chip.active .check-icon svg {
    display: block;
  }

  .topic-left {
    display: flex;
    align-items: center;
    flex: 1;
  }

  .start-bar {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 16px 0 8px;
    margin-top: 8px;
  }

  button.primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button.primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.primary:active:not(:disabled) {
    opacity: 0.85;
  }

  .total-info {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  /* Quiz screen */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .progress-bar {
    height: 5px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s;
  }

  .question-topic-tag {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: rgba(91,140,255,0.12);
    border-radius: 6px;
    padding: 3px 8px;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height: 1.5;
  }

  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .option:disabled {
    cursor: default;
  }

  .option.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
  }

  .option.wrong {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger-text);
  }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  button.secondary {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: border-color 0.15s, background 0.15s;
  }

  button.secondary:hover {
    border-color: var(--accent);
  }

  .hint-box {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid #f0b429;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .info-card {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .info-card .result-label {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
  }

  .info-card.is-correct {
    border-color: var(--success-border);
  }
  .info-card.is-correct .result-label {
    color: var(--success-text);
  }
  .info-card.is-wrong {
    border-color: var(--danger-border);
  }
  .info-card.is-wrong .result-label {
    color: var(--danger-text);
  }

  .next-btn {
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Results screen */
  .result-hero {
    text-align: center;
    padding: 32px 16px;
  }

  .result-score {
    font-size: 48px;
    font-weight: 700;
    margin: 8px 0 4px;
  }

  .result-pct {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .topic-breakdown {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .topic-breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--card-border);
  }

  .topic-breakdown-row:last-child {
    border-bottom: none;
  }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 28px;
    padding-bottom: 20px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- TOPIC SELECTION SCREEN -->
  <div id="screen-select">
    <h1>Algoritma Analizi - Quiz</h1>
    <p class="subtitle">Çalışmak istediğin konu başlıklarını seç, birden fazla seçebilirsin.</p>

    <div class="topic-grid" id="topic-grid"></div>

    <div class="start-bar">
      <p class="total-info" id="total-info">0 soru seçildi</p>
      <button class="primary" id="start-btn" disabled>Quizi Başlat</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-header">
      <span id="q-counter">Soru 1 / 1</span>
      <span id="q-score">Skor: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div id="q-topic-tag" class="question-topic-tag"></div>
    <p class="question-text" id="q-text"></p>
    <div id="q-options"></div>

    <div class="action-row" id="hint-row">
      <button class="secondary" id="hint-btn">💡 İpucu</button>
    </div>
    <div class="hint-box hidden" id="hint-box"></div>

    <div id="info-card-wrap"></div>
    <button class="next-btn hidden" id="next-btn">Sonraki Soru →</button>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="hidden">
    <div class="result-hero">
      <p class="subtitle" style="margin:0;">Test tamamlandı</p>
      <div class="result-score" id="result-score">0 / 0</div>
      <div class="result-pct" id="result-pct">%0</div>
    </div>
    <div class="topic-breakdown" id="topic-breakdown"></div>
    <div class="action-row">
      <button class="secondary" id="restart-same">Aynı konularla tekrar</button>
      <button class="secondary" id="restart-new">Konu seçimine dön</button>
    </div>
  </div>

  <footer>Algoritma Analizi Çalışma Quiz'i &middot; Arkadaşlarınla paylaşabilirsin</footer>
</div>

<script>
// ============ SORU VERİTABANI ============
const QUESTION_BANK = {
  "BST": [
    {
      q: "Binary Search Tree'de 'en kötü durum' karmaşıklığı O(n) olur, çünkü:",
      options: ["Ağaç dengeli büyür", "Ağaç zincir (tek yönlü) şeklinde büyür", "Her düğümde 2 çocuk vardır", "Hash çakışması olur"],
      correct: 1,
      hint: "T(n) = T(n-1) + c recurrence'ını düşün.",
      explain: "Ağaç zincir gibi (her düğümün tek çocuğu) büyürse, T(n)=T(n-1)+c olur ve telescoping ile T(n)=O(n) çıkar."
    },
    {
      q: "BST'de ortalama durum recurrence'ı T(n) = T(n/2) + c'nin sonucu nedir?",
      options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"],
      correct: 1,
      hint: "Her adımda problem yarıya bölünüyor, kaç adım sonra 1'e ulaşılır?",
      explain: "Her adımda n yarıya bölünür (n -> n/2 -> n/4 -> ... -> 1). Toplam log n adım gerekir, dolayısıyla O(log n)."
    },
    {
      q: "Recursive search fonksiyonunda 'if (key < root.key)' koşulu doğruysa ne yapılır?",
      options: ["search(root.right, key) çağrılır", "search(root.left, key) çağrılır", "root döndürülür", "null döndürülür"],
      correct: 1,
      hint: "BST kuralı: sol < kök < sağ.",
      explain: "Aranan key, kök değerden küçükse, sonuç ağacın SOL alt ağacında olmalıdır, dolayısıyla search(root.left, key) çağrılır."
    },
    {
      q: "Iterative Insertion'da n eleman eklerken 'en kötü durum' karmaşıklığı nedir?",
      options: ["O(1)", "O(n log n)", "O(n)", "O(n^2)"],
      correct: 3,
      hint: "Ağaç zincir şeklinde büyürse, n. eleman eklenirken n-1 karşılaştırma gerekir.",
      explain: "k=0 olduğunda T(n)=T(0)+T(n-1)+c olur. n eleman eklerken toplam karşılaştırma sayısı 0+1+2+...+(n-1)=n(n-1)/2, yani O(n^2)."
    },
    {
      q: "Iterative Insertion'da n eleman eklerken 'en iyi durum' (dengeli ağaç) karmaşıklığı nedir?",
      options: ["O(1)", "O(log n)", "O(n log n)", "O(n^2)"],
      correct: 2,
      hint: "T(n) = 2T(n/2) + c recurrence'ını çöz.",
      explain: "k=n/2 olduğunda T(n)=2T(n/2)+c olur. Bu recurrence'ın çözümü O(n log n)'dir (her seviyede toplam n iş, log n seviye)."
    },
    {
      q: "BST'de bir tek eleman eklerken 'en iyi durum' karmaşıklığı nedir?",
      options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
      correct: 0,
      hint: "Ağaç boşsa, eklenen eleman direkt kök olur.",
      explain: "Ağaç boşsa veya kök hemen bulunabiliyorsa, sadece 1 işlem yeterlidir, bu da O(1)'dir."
    },
    {
      q: "Iterative Insertion'daki genel denklem T(n) = T(k) + T(n-k-1) + c'de k neyi temsil eder?",
      options: ["Sağ alt ağaçtaki düğüm sayısını", "Sol alt ağaçtaki düğüm sayısını", "Ağacın yüksekliğini", "Toplam düğüm sayısını"],
      correct: 1,
      hint: "n-k-1 ifadesi geri kalan (sağ) tarafı temsil ediyor.",
      explain: "k, sol alt ağaca düşen düğüm sayısını temsil eder; n-k-1 ise sağ alt ağaca düşen düğüm sayısı olur (1 düğüm de kök için ayrılır)."
    },
    {
      q: "BST'de preorder traversal hangi sırayla gezinir?",
      options: ["Sol-Kök-Sağ", "Kök-Sol-Sağ", "Sol-Sağ-Kök", "Sağ-Kök-Sol"],
      correct: 1,
      hint: "'Pre' = önce, kök önce ziyaret edilir.",
      explain: "Preorder traversal Kök-Sol-Sağ sırasıyla gezinir: önce kök yazdırılır, sonra sol alt ağaç, sonra sağ alt ağaç gezilir."
    },
    {
      q: "BST'de postorder traversal hangi sırayla gezinir?",
      options: ["Kök-Sol-Sağ", "Sol-Kök-Sağ", "Sol-Sağ-Kök", "Sağ-Sol-Kök"],
      correct: 2,
      hint: "'Post' = sonra, kök en son ziyaret edilir.",
      explain: "Postorder traversal Sol-Sağ-Kök sırasıyla gezinir: önce sol alt ağaç, sonra sağ alt ağaç, en son kök ziyaret edilir."
    },
    {
      q: "Level-order (BFS tarzı) ağaç gezintisi hangi veri yapısını kullanır?",
      options: ["Stack", "Queue", "Heap", "Hiçbiri, recursive çalışır"],
      correct: 1,
      hint: "Seviye seviye gezinmek FIFO mantığı gerektirir.",
      explain: "Level-order traversal, düğümleri seviye seviye (yukarıdan aşağıya, soldan sağa) gezdiği için Queue (kuyruk) kullanır."
    },
    {
      q: "BST'de search fonksiyonunda 'key == root.key' koşulu sağlanırsa ne döner?",
      options: ["null", "root", "root.left", "root.right"],
      correct: 1,
      hint: "Aranan eleman bulundu demektir.",
      explain: "Aranan key, kök düğümün key değerine eşitse, arama başarılı olmuştur ve root döndürülür."
    }
  ],
  "Hashing": [
    {
      q: "Hash tablolarda alpha = N/M oranına ne denir?",
      options: ["Hash factor", "Load factor (doluluk oranı)", "Collision rate", "Probe sequence"],
      correct: 1,
      hint: "N = eleman sayısı, M = slot sayısı.",
      explain: "alpha = N/M oranı 'load factor' (doluluk oranı) olarak adlandırılır ve hash tablosunun performansını belirleyen en önemli faktördür."
    },
    {
      q: "Linear Probing'de p(k,i) = (h(k) + i*c) mod M formülü hangi yönteme aittir?",
      options: ["Quadratic Probing", "Double Hashing", "Linear Probing", "Separate Chaining"],
      correct: 2,
      hint: "İsim formülün içinde geçiyor.",
      explain: "Bu formül doğrusal (linear) artışla bir sonraki slotu hesapladığı için Linear Probing'e aittir."
    },
    {
      q: "Linear Probing'de 'başarısız arama' maliyeti hangi işlemle aynıdır?",
      options: ["Silme", "Güncelleme", "Ekleme", "Traversal"],
      correct: 2,
      hint: "Yeni eleman eklemek için önce boş slot bulmak gerekir.",
      explain: "Ekleme (put) işlemi için boş bir slot bulunana kadar ilerlenir, bu tam olarak başarısız aramanın yaptığı işlemdir."
    },
    {
      q: "Linear Probing'de 'başarılı arama / silme' maliyeti hangi işlemle aynıdır?",
      options: ["Ekleme", "Başarısız arama", "Birbirleriyle aynıdır (başarılı arama = silme)", "Hiçbiriyle aynı değildir"],
      correct: 2,
      hint: "Silme yapmadan önce elemanı bulman gerekir.",
      explain: "Silme işlemi önce elemanı ARAMAYI gerektirir (başarılı arama), bu yüzden ikisinin maliyeti aynıdır: 1/2 * (1 + 1/(1-alpha))."
    },
    {
      q: "Separate Chaining'de 'başarısız arama' beklenen karşılaştırma sayısı formülü hangisidir?",
      options: ["alpha", "(1 + alpha - e^-alpha) / 2", "1 - alpha", "alpha^2"],
      correct: 0,
      hint: "Poisson dağılımının beklenen değerini düşün.",
      explain: "Poisson dağılımı E[X]=alpha olduğu için, başarısız arama beklenen karşılaştırma sayısı direkt alpha'ya eşit çıkar."
    },
    {
      q: "Open Hashing (Separate Chaining) yapısında çakışan elemanlar nereye eklenir?",
      options: ["Bir sonraki boş slota", "Aynı slotun linked list'ine", "Tablonun en sonuna", "Silinirler"],
      correct: 1,
      hint: "'Separate Chaining' ismindeki 'chain' (zincir) kelimesini düşün.",
      explain: "Her slot bir linked list (zincir) tutar; çakışan elemanlar bu listeye eklenir, mevcut tablo elemanı silinmez veya taşınmaz."
    },
    {
      q: "deleted flag (boolean) Open Addressing'de neden gereklidir?",
      options: [
        "Belleği artırmak için",
        "Silinen slotu null yapmak arama zincirini bozar, bu yüzden işaretleme gerekir",
        "Hash fonksiyonunu hızlandırmak için",
        "Hiçbir nedeni yok, isteğe bağlıdır"
      ],
      correct: 1,
      hint: "Bir slotu null yaparsan, arama o noktada 'eleman yok' diye düşünüp duracaktır.",
      explain: "Fiziksel silme (null yapma) yapılırsa, probe sequence kesintiye uğrar ve sonraki elemanlara erişim kaybedilebilir. deleted=true ile arama bu slotu atlayıp devam eder."
    },
    {
      q: "Quadratic Probing'in Linear Probing'e göre avantajı nedir?",
      options: [
        "Daha az bellek kullanır",
        "Kümelenme (clustering) problemini azaltır",
        "Negatif sayılarla çalışabilir",
        "Hiçbir avantajı yoktur"
      ],
      correct: 1,
      hint: "Linear Probing'de ardışık slotlar dolarsa kümeler oluşur.",
      explain: "Quadratic Probing, adım büyüklüğünü kareler şeklinde artırarak (1, 4, 9...) Linear Probing'deki birincil kümelenme (primary clustering) sorununu azaltır."
    },
    {
      q: "Double Hashing yönteminde p(k,i) = (h1(k) + i*h2(k)) mod M formülünde h2(k) fonksiyonu için hangi koşul önemlidir?",
      options: [
        "h2(k) her zaman 0 olmalı",
        "h2(k), M ile aralarında ortak bölen olmamalı (M'ye göre asal gibi davranmalı)",
        "h2(k) negatif olmalı",
        "h2(k) = h1(k) olmalı"
      ],
      correct: 1,
      hint: "Tüm slotların gezilebilmesi için özel bir koşul gerekir.",
      explain: "Double Hashing'in tüm tabloyu tarayabilmesi için h2(k) değerinin M ile aralarında 1'den başka ortak bölen olmaması (coprime olması) gerekir."
    },
    {
      q: "Hash fonksiyonu h(x) = x mod M'de M değeri için ne söylenebilir?",
      options: [
        "M her zaman çift sayı olmalı",
        "M genellikle bir asal sayı seçilirse çakışmalar azalır",
        "M'nin değeri önemli değildir",
        "M her zaman 10'un katı olmalı"
      ],
      correct: 1,
      hint: "Asal sayılar, hash değerlerinin daha düzgün dağılmasını sağlar.",
      explain: "M asal sayı seçildiğinde, hash fonksiyonunun çıktıları (mod M) daha düzgün dağılır ve çakışma olasılığı azalır."
    },
    {
      q: "Hash tablosunda alpha (load factor) 1'den büyük olabilir mi?",
      options: [
        "Hayır, asla olamaz",
        "Sadece Open Addressing'de olabilir",
        "Sadece Separate Chaining'de olabilir, çünkü her slot birden fazla eleman tutabilir",
        "Her zaman tam 1 olmalı"
      ],
      correct: 2,
      hint: "Open Addressing'de her slotta en fazla 1 eleman olabilir ama Separate Chaining'de değil.",
      explain: "Separate Chaining'de her slot bir linked list tuttuğu için, N (eleman sayısı) M'den (slot sayısı) büyük olabilir, yani alpha 1'i aşabilir. Open Addressing'de ise alpha hiçbir zaman 1'i geçemez."
    }
  ],

// ============ STATE ============
let selectedTopics = new Set();
let activeQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let hintShown = false;
let topicScores = {};

// ============ TOPIC SELECTION SCREEN ============
function renderTopicSelect() {
  const grid = document.getElementById('topic-grid');
  grid.innerHTML = '';

  Object.keys(QUESTION_BANK).forEach(topic => {
    const count = QUESTION_BANK[topic].length;
    const chip = document.createElement('div');
    chip.className = 'topic-chip' + (selectedTopics.has(topic) ? ' active' : '');
    chip.innerHTML = `
      <div class="topic-left">
        <div class="check-icon">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8L6.5 11.5L13 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="topic-name">${topic}</span>
      </div>
      <span class="topic-count">${count} soru</span>
    `;
    chip.addEventListener('click', () => {
      if (selectedTopics.has(topic)) {
        selectedTopics.delete(topic);
      } else {
        selectedTopics.add(topic);
      }
      renderTopicSelect();
    });
    grid.appendChild(chip);
  });

  let total = 0;
  selectedTopics.forEach(t => total += QUESTION_BANK[t].length);

  const totalInfo = document.getElementById('total-info');
  const startBtn = document.getElementById('start-btn');

  if (total === 0) {
    totalInfo.textContent = 'Henüz konu seçilmedi';
    startBtn.disabled = true;
  } else {
    totalInfo.textContent = `${selectedTopics.size} konu, toplam ${total} soru seçildi`;
    startBtn.disabled = false;
  }
}

document.getElementById('start-btn').addEventListener('click', startQuiz);

function startQuiz() {
  activeQuestions = [];
  selectedTopics.forEach(topic => {
    QUESTION_BANK[topic].forEach(q => {
      activeQuestions.push({ ...q, topic });
    });
  });

  // Shuffle
  for (let i = activeQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [activeQuestions[i], activeQuestions[j]] = [activeQuestions[j], activeQuestions[i]];
  }

  currentIndex = 0;
  score = 0;
  topicScores = {};
  selectedTopics.forEach(t => topicScores[t] = { correct: 0, total: 0 });

  document.getElementById('screen-select').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');

  renderQuestion();
}

// ============ QUIZ SCREEN ============
function renderQuestion() {
  answered = false;
  hintShown = false;

  const item = activeQuestions[currentIndex];

  document.getElementById('q-counter').textContent = `Soru ${currentIndex + 1} / ${activeQuestions.length}`;
  document.getElementById('q-score').textContent = `Skor: ${score}`;
  document.getElementById('progress-fill').style.width = (currentIndex / activeQuestions.length * 100) + '%';
  document.getElementById('q-topic-tag').textContent = item.topic;
  document.getElementById('q-text').textContent = item.q;

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsDiv.appendChild(btn);
  });

  document.getElementById('hint-row').classList.remove('hidden');
  document.getElementById('hint-box').classList.add('hidden');
  document.getElementById('info-card-wrap').innerHTML = '';
  document.getElementById('next-btn').classList.add('hidden');
}

document.getElementById('hint-btn').addEventListener('click', () => {
  hintShown = !hintShown;
  const box = document.getElementById('hint-box');
  if (hintShown) {
    box.textContent = '💡 ' + activeQuestions[currentIndex].hint;
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
});

function selectAnswer(selectedIdx) {
  if (answered) return;
  answered = true;

  const item = activeQuestions[currentIndex];
  const isCorrect = selectedIdx === item.correct;

  if (isCorrect) {
    score++;
  }

  topicScores[item.topic].total++;
  if (isCorrect) topicScores[item.topic].correct++;

  const optionsDiv = document.getElementById('q-options');
  const buttons = optionsDiv.querySelectorAll('.option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) {
      btn.classList.add('correct');
    } else if (i === selectedIdx) {
      btn.classList.add('wrong');
    }
  });

  document.getElementById('hint-row').classList.add('hidden');
  document.getElementById('hint-box').classList.add('hidden');

  const infoWrap = document.getElementById('info-card-wrap');
  const card = document.createElement('div');
  card.className = 'info-card ' + (isCorrect ? 'is-correct' : 'is-wrong');
  card.innerHTML = `
    <span class="result-label">${isCorrect ? '✓ Doğru!' : '✗ Yanlış'}</span>
    ${item.explain}
  `;
  infoWrap.innerHTML = '';
  infoWrap.appendChild(card);

  document.getElementById('q-score').textContent = `Skor: ${score}`;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = (currentIndex < activeQuestions.length - 1) ? 'Sonraki Soru →' : 'Sonuçları Gör';
}

document.getElementById('next-btn').addEventListener('click', () => {
  if (currentIndex < activeQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

// ============ RESULTS SCREEN ============
function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');

  const pct = Math.round((score / activeQuestions.length) * 100);
  document.getElementById('result-score').textContent = `${score} / ${activeQuestions.length}`;
  document.getElementById('result-pct').textContent = `%${pct}`;

  const breakdown = document.getElementById('topic-breakdown');
  breakdown.innerHTML = '';
  Object.keys(topicScores).forEach(topic => {
    const ts = topicScores[topic];
    if (ts.total === 0) return;
    const row = document.createElement('div');
    row.className = 'topic-breakdown-row';
    row.innerHTML = `<span>${topic}</span><span>${ts.correct} / ${ts.total}</span>`;
    breakdown.appendChild(row);
  });
}

document.getElementById('restart-same').addEventListener('click', startQuiz);

document.getElementById('restart-new').addEventListener('click', () => {
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-select').classList.remove('hidden');
  renderTopicSelect();
});

// ============ INIT ============
renderTopicSelect();
</script>
